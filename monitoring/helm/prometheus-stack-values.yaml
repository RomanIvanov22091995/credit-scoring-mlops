# =============================================================================
# kube-prometheus-stack: Prometheus + Grafana + Alertmanager (namespace monitoring)
# Установка: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#            helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#              -n monitoring --create-namespace -f monitoring/helm/prometheus-stack-values.yaml
# =============================================================================
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 20GB
    scrapeInterval: 15s
    evaluationInterval: 15s
    serviceMonitorSelectorNilUsesHelmValues: false   # видеть ServiceMonitor всех namespaces
    ruleSelectorNilUsesHelmValues: false             # и PrometheusRule всех namespaces
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 25Gi
    # remote write в Yandex Monitoring (ключ из Terraform monitoring-модуля)
    # remoteWrite:
    #   - url: https://monitoring.api.cloud.yandex.net/monitoring/v2/prometheusMetrics
    #     basicAuth:
    #       username: <folder_id>
    #     bearerTokenFile: /run/secrets/monitoring-api-key

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

alertmanager:
  alertmanagerSpec:
    retention: 120h
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
  config:
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "default"
      routes:
        - match:
            severity: critical
          receiver: "oncall"
          continue: false
        - match:
            severity: warning
          receiver: "slack"
    receivers:
      - name: "default"
      - name: "slack"
        slack_configs:
          - send_resolved: true
            channel: "#mlops-alerts"
            api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/url
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
      - name: "oncall"
        slack_configs:
          - send_resolved: true
            channel: "#oncall-ml"
            api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/url
            title: 'CRITICAL: {{ .CommonLabels.alertname }}'
        pagerduty_configs:
          - send_resolved: true
            routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/key

grafana:
  admin:
    existingSecret: grafana-admin-credentials   # не дефолтный пароль!
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard        # ConfigMap с этим label подхватываются автоматически
      labelValue: "1"
      searchNamespace: ALL
  # Датасорс Loki приходит из loki-stack (ConfigMap loki-loki-stack, isDefault=false —
  # см. docs/deployment_guide.md: правим после установки loki-stack)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
    auth.anonymous:
      enabled: false
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: ["grafana.example.com"]

defaultRules:
  create: true
  rules:
    etcd: false     # не нужен на managed control plane
