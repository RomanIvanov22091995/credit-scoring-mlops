# Дашборды для sidecar Grafana (label grafana_dashboard=1)
# Генерируется из monitoring/grafana/dashboards/*.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-scoring
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  api-performance.json: |
    {
     "uid": "scoring-api-perf",
     "title": "Credit Scoring — API Performance",
     "tags": [
      "credit-scoring",
      "api"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "refresh": "30s",
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "templating": {
      "list": [
       {
        "name": "instance",
        "label": "Pod",
        "type": "query",
        "datasource": {
         "type": "prometheus",
         "uid": "${DS_PROMETHEUS}"
        },
        "query": "label_values(scoring_api_requests_total, pod)",
        "includeAll": true
       }
      ]
     },
     "panels": [
      {
       "id": 1,
       "title": "RPS (запросов/сек)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(rate(scoring_api_requests_total{endpoint=\"/predict\"}[1m]))",
         "refId": "A",
         "legendFormat": "predict",
         "range": true
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(rate(scoring_api_requests_total[1m]))",
         "refId": "B",
         "legendFormat": "все",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 2,
       "title": "Латентность HTTP: p50/p95/p99",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 8,
        "y": 0,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "histogram_quantile(0.50, sum(rate(scoring_api_request_latency_seconds_bucket[5m])) by le)",
         "refId": "A",
         "legendFormat": "p50",
         "range": true
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "histogram_quantile(0.95, sum(rate(scoring_api_request_latency_seconds_bucket[5m])) by le)",
         "refId": "B",
         "legendFormat": "p95",
         "range": true
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "histogram_quantile(0.99, sum(rate(scoring_api_request_latency_seconds_bucket[5m])) by le)",
         "refId": "C",
         "legendFormat": "p99",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": 0.05
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 3,
       "title": "Доля ошибок 5xx",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 16,
        "y": 0,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(rate(scoring_api_requests_total{status=~\"5..\"}[5m])) / sum(rate(scoring_api_requests_total[5m]))",
         "refId": "A",
         "legendFormat": "5xx ratio",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 0.02
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 4,
       "title": "Латентность инференса модели (ONNX)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "histogram_quantile(0.50, sum(rate(scoring_model_inference_latency_seconds_bucket[5m])) by le)",
         "refId": "A",
         "legendFormat": "p50",
         "range": true
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "histogram_quantile(0.99, sum(rate(scoring_model_inference_latency_seconds_bucket[5m])) by le)",
         "refId": "B",
         "legendFormat": "p99",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 5,
       "title": "Скорость предсказаний (объектов/сек)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 12,
        "y": 8,
        "w": 6,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(rate(scoring_model_predictions_total[1m]))",
         "refId": "A",
         "legendFormat": "predictions",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 6,
       "title": "Cache hit ratio (Redis)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 18,
        "y": 8,
        "w": 6,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(rate(scoring_api_cache_operations_total{result=\"hit\"}[5m])) / clamp_min(sum(rate(scoring_api_cache_operations_total[5m])), 1e-9)",
         "refId": "A",
         "legendFormat": "hit ratio",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 7,
       "title": "Реплики API (HPA)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 0,
        "y": 16,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"credit-scoring\"}",
         "refId": "A",
         "legendFormat": "текущие",
         "range": true
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"credit-scoring\"}",
         "refId": "B",
         "legendFormat": "max",
         "range": true
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "kube_deployment_status_replicas_available{namespace=\"credit-scoring\",deployment=\"scoring-api\"}",
         "refId": "C",
         "legendFormat": "готовые",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 8,
       "title": "CPU/Memory подов API",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 8,
        "y": 16,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"credit-scoring\",pod=~\"scoring-api.*\"}[5m])) by (pod)",
         "refId": "A",
         "legendFormat": "{{pod}} CPU",
         "range": true
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(container_memory_working_set_bytes{namespace=\"credit-scoring\",pod=~\"scoring-api.*\"}) by (pod)",
         "refId": "B",
         "legendFormat": "{{pod}} Mem",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 9,
       "title": "Версия модели (info)",
       "type": "table",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 16,
        "y": 16,
        "w": 8,
        "h": 4
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "scoring_model_info",
         "refId": "A",
         "legendFormat": "",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 10,
       "title": "Распределение вероятности дефолта",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 16,
        "y": 20,
        "w": 8,
        "h": 4
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(rate(scoring_model_predicted_probability_bucket[5m])) by (le)",
         "refId": "A",
         "legendFormat": "{{le}}",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      }
     ]
    }
  model-drift.json: |
    {
     "uid": "scoring-model-drift",
     "title": "Credit Scoring — Model Quality & Data Drift",
     "tags": [
      "credit-scoring",
      "model",
      "drift"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "refresh": "5m",
     "panels": [
      {
       "id": 1,
       "title": "Доля дрейфовавших признаков (Evidently)",
       "type": "gauge",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "scoring_drift_share_drifted_features",
         "refId": "A",
         "legendFormat": "",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "percentunit",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "yellow",
            "value": 0.15
           },
           {
            "color": "red",
            "value": 0.25
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "showThresholdLabels": false,
        "showThresholdMarkers": true
       }
      },
      {
       "id": 2,
       "title": "AUC на свежих данных",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 8,
        "y": 0,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "scoring_drift_test_auc",
         "refId": "A",
         "legendFormat": "current AUC",
         "range": true
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "max(scoring_drift_test_auc)",
         "refId": "B",
         "legendFormat": "historical max",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "none",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 0.68
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 3,
       "title": "Возраст последней проверки дрифта",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 16,
        "y": 0,
        "w": 8,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "(time() - scoring_drift_last_check_timestamp_seconds)",
         "refId": "A",
         "legendFormat": "возраст, с",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         },
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 7200
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 4,
       "title": "Predicted probability distribution (hourly)",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 0,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(increase(scoring_model_predicted_probability_bucket[1h])) by (le)",
         "refId": "A",
         "legendFormat": "{{le}}",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "bottom",
         "calcs": [
          "mean",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi"
        }
       }
      },
      {
       "id": 5,
       "title": "Preds per model version",
       "type": "timeseries",
       "datasource": {
        "type": "prometheus",
        "uid": "${DS_PROMETHEUS}"
       },
       "gridPos": {
        "x": 12,
        "y": 8,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${DS_PROMETHEUS}"
         },
         "editorMode": "code",
         "expr": "sum(rate(scoring_model_predictions_total[5m])) by (model_version)",
         "refId": "A",
         "legendFormat": "{{model_version}}",
         "range": true
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps",
         "custom": {
          "drawStyle": "line",
          "lineInterpolation": "smooth",
          "fillOpacity": 8,
          "showPoints": "never"
         }
        },
