# Автономный Prometheus (для отладки без Kubernetes).
# Полноценная установка в кластере — helm chart kube-prometheus-stack
# (monitoring/helm/prometheus-stack-values.yaml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Сам Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Credit Scoring API (локальный запуск uvicorn на 8000)
  - job_name: scoring-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # (в кластере этот job создаёт ServiceMonitor — см.
  #  deployment/kubernetes/base/80-servicemonitor.yaml)
