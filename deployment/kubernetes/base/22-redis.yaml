# Redis: кеш предсказаний (Этап 7). Лёгкий single-node с ограничением памяти.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: credit-scoring
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: credit-scoring
spec:
  replicas: 1
  strategy:
    type: Recreate   # один PVC не умеет RWO от двух подов
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server"]
          args:
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"      # кеш — eviction нормальны
            - "--save"
            - ""                 # персистенция не нужна: это только кеш
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: credit-scoring
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
