# Шаблон секретов. РЕАЛЬНЫЕ значения задаются через sealed-secrets / External
# Secrets / CI (kubectl create secret --dry-run). Значения ниже — примеры
# (base64 от заглушек), в production заменяются GitOps-инструментом.
apiVersion: v1
kind: Secret
metadata:
  name: scoring-secrets
  namespace: credit-scoring
  labels:
    app.kubernetes.io/part-of: credit-scoring
type: Opaque
stringData:
  # S3/DVC remote (Yandex Object Storage) — static key из Terraform storage-модуля
  AWS_ACCESS_KEY_ID: "REPLACE_VIA_CI"
  AWS_SECRET_ACCESS_KEY: "REPLACE_VIA_CI"
  # Если используется внутренний Redis с паролем
  REDIS_PASSWORD: ""
