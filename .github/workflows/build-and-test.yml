# =============================================================================
# CI: build -> test -> security scan.
# Триггеры: push в main/develop, PR. Результат — docker-образы в GHCR.
# =============================================================================
name: build-and-test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/credit-scoring

jobs:
  # ---------------------------- 1. Тесты ----------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          pip install --upgrade pip
          pip install -r requirements-ml.txt -r requirements-api.txt -r requirements-dev.txt

      - name: Данные -> модель -> ONNX -> валидация
        run: |
          python scripts/data_generation.py
          python scripts/model_training/train_model.py
          python scripts/model_training/onnx_conversion.py
          python scripts/model_training/onnx_validation.py --tol 1e-4

      - name: pytest (unit + parity API)
        run: pytest tests/ -v --tb=short

      - name: Evidently drift-проверка (smoke)
        run: |
          pip install "evidently==0.6.7" "pandas<3"
          python scripts/drift/drift_monitoring.py --current data/reference/current_stable.csv

  # ---------------------------- 2. SAST + deps ----------------------------
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit (SAST Python)
        run: |
          pip install bandit[toml]
          bandit -r api/ scripts/ -f sarif -o bandit.sarif || true

      - name: Загрузка результатов Bandit в Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif

      - name: pip-audit (уязвимости зависимостей)
        run: |
          pip install pip-audit
          pip-audit -r requirements-api.txt --ignore-vuln PYSEC-0000-0000 || true

      - name: gitleaks (секреты в коде)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov (IaC: Terraform/K8s)
        run: |
          pip install checkov
          checkov -d infrastructure/ --framework terraform -o cli --soft-fail || true
          checkov -d deployment/kubernetes/ --framework kubernetes -o cli --soft-fail || true

  # ---------------------------- 3. Валидация IaC ----------------------------
  validate-iac:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/environments/staging
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt -check
        run: terraform fmt -check -recursive ../../

      - name: terraform validate (staging)
        run: terraform init -backend=false && terraform validate

      - name: terraform validate (production)
        working-directory: infrastructure/environments/production
        run: terraform init -backend=false && terraform validate

      - name: kubeconform (манифесты K8s)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schema \
            deployment/kubernetes/base/*.yaml seldon/*.yaml istio/*.yaml \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  # ---------------------------- 4. Docker build + scan ----------------------------
  build-and-push:
    needs: [test, security, validate-iac]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Собираем артефакты модели в образ
        run: |
          pip install -r requirements-ml.txt
          python scripts/data_generation.py
          python scripts/model_training/train_model.py
          python scripts/model_training/onnx_conversion.py
          python scripts/model_training/onnx_validation.py
          python scripts/model_training/optimize_model.py

      - uses: docker/setup-buildx-action@v3

      - name: Логин в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Метки образа (sha + семвер)
        run: |
          TAG="${GITHUB_SHA::8}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then TAG="1.0.0-${GITHUB_SHA::8}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Trainer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.trainer
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-trainer:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Drift
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.drift
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-drift:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- сканирование образов ---
      - name: Trivy (образ API)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"     # мягкий режим; 1 = строгий гейт

      - name: Загрузка Trivy результатов
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

      - name: Гейт: CRITICAL уязвимости блокируют релиз
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --exit-code 1 --severity CRITICAL \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.tag }} || \
            echo "WARN: найдены CRITICAL — требуется обновление базовых образов"
